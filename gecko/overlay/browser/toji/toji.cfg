// --- Kept on purpose: security-critical Mozilla services ------------------
// Add-on signing (compiled in with MOZ_REQUIRE_SIGNING), the add-on
// blocklist, and certificate revocation (CRLite + intermediates) all arrive
// through Remote Settings; Widevine arrives through GMP.
lockPref("extensions.blocklist.enabled", true);
lockPref("security.remote_settings.crlite_filters.enabled", true);
lockPref("security.remote_settings.intermediates.enabled", true);
lockPref("media.eme.enabled", true);
lockPref("media.gmp-widevinecdm.enabled", true);
lockPref("media.gmp-widevinecdm.visible", true);

// --- Toji behaviour --------------------------------------------------------
// WebRTC never volunteers local interface addresses, in any container.
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.obfuscate_host_addresses", true);
// Containers are Toji's profiles, one window each, and Toji's own: it numbers
// them itself and keeps no Firefox identity records. Firefox's container
// feature — its per-tab menus, its containers settings page, the add-on
// contextualIdentities API — is off; Gecko's isolation by userContextId needs
// no switch. A link from another app never guesses a container from open tabs:
// the window it lands in decides.
lockPref("privacy.userContext.enabled", false);
lockPref("privacy.userContext.ui.enabled", false);
lockPref("browser.link.force_default_user_context_id_for_external_opens", true);
// Toji's vault (container-scoped, exact-origin) is the only password manager;
// Firefox's own would save and offer logins across containers.
lockPref("signon.rememberSignons", false);
lockPref("signon.autofillForms", false);
lockPref("signon.generation.enabled", false);
lockPref("signon.management.page.enabled", false);
lockPref("signon.passwordEditCapture.enabled", false);
lockPref("extensions.formautofill.addresses.enabled", false);
lockPref("extensions.formautofill.creditCards.enabled", false);
// Search suggestions would send every keystroke to the engine.
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("browser.search.update", false);
// Proxy DNS through SOCKS when a proxy is used (Tor containers).
lockPref("network.proxy.socks_remote_dns", true);
lockPref("network.proxy.socks5_remote_dns", true);

// --- Tor containers fail closed -------------------------------------------
// A dead proxy must never fall back to DIRECT (also compiled out with
// --disable-proxy-direct-failover), a lone failed proxy must be retried rather
// than pruned (pruning leaves "direct"), nothing may bypass the proxy, and no
// host may be exempted from it.
lockPref("network.proxy.failover_direct", false);
lockPref("network.proxy.retry_failed_proxies", true);
lockPref("network.proxy.allow_bypass", false);
lockPref("network.proxy.no_proxies_on", "");
// Firefox otherwise never proxies loopback, which would let a Tor container's
// pages reach services on this machine; TojiProxy decides loopback too.
lockPref("network.proxy.allow_hijacking_localhost", true);
lockPref("network.dns.force_use_https_rr", false);
// These resolve or connect without asking the proxy filter, so they would leak
// a Tor container's destinations to the local network.
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.prefetch-next", false);
lockPref("network.preconnect", false);
lockPref("network.early-hints.preconnect.enabled", false);
lockPref("network.http.speculative-parallel-limit", 0);
lockPref("browser.urlbar.speculativeConnect.enabled", false);
lockPref("browser.places.speculativeConnect.enabled", false);
// OCSP requests drop the container and would go direct from a Tor container;
// revocation comes from CRLite instead (enforcing), with stapled OCSP still used.
lockPref("security.OCSP.enabled", 0);
lockPref("security.pki.crlite_mode", 2);
// WebRTC goes through a proxy when the page's channel does. Tor containers get
// no peer connections at all (TojiStartup's blocker), which relies on the
// permission check staying on.
lockPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);
lockPref("media.navigator.permission.disabled", false);
// .onion names never reach the local resolver; tor resolves them.
lockPref("network.dns.blockDotOnion", true);
defaultPref("browser.aboutConfig.showWarning", false);

// --- Battery: nothing runs while a page sits still ------------------------
// The bug reporter's rolling 15-second recording (a full-window capture at
// 15 frames a second) is opt-in, from Settings; the agent server sidecar
// starts on first use, not at launch.
defaultPref("toji.replay", false);
defaultPref("toji.agent.autostart", false);
// The session is written every 30 s of activity instead of every 15 s; a
// crash never asks (max_resumed_crashes is -1), it just comes back.
defaultPref("browser.sessionstore.interval", 30000);
// Page thumbnails fed Firefox's new tab page; Toji's start page shows none, so
// the per-load capture timers and scroll listeners have nothing to do.
defaultPref("browser.pagethumbnails.capturing_disabled", true);
// Under macOS memory pressure, unload background tabs (0x1) rather than swap.
defaultPref("browser.lowMemoryResponseMask", 1);
defaultPref("browser.tabs.unloadOnLowMemory", true);
