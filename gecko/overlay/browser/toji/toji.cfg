// --- Kept on purpose: security-critical Mozilla services ------------------
// Add-on signing (compiled in with MOZ_REQUIRE_SIGNING), the add-on
// blocklist, and certificate revocation (CRLite + intermediates) all arrive
// through Remote Settings; Widevine arrives through GMP.
lockPref("extensions.blocklist.enabled", true);
lockPref("security.remote_settings.crlite_filters.enabled", true);
lockPref("security.remote_settings.intermediates.enabled", true);
lockPref("media.eme.enabled", true);
lockPref("media.gmp-widevinecdm.enabled", true);
lockPref("media.gmp-widevinecdm.visible", true);

// --- Toji behaviour --------------------------------------------------------
// WebRTC never volunteers local interface addresses, in any container.
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.obfuscate_host_addresses", true);
// Containers are Toji's profiles.
lockPref("privacy.userContext.enabled", true);
defaultPref("privacy.userContext.ui.enabled", true);
// Search suggestions would send every keystroke to the engine.
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("browser.search.update", false);
// Proxy DNS through SOCKS when a proxy is used (Tor containers).
lockPref("network.proxy.socks_remote_dns", true);
lockPref("network.proxy.socks5_remote_dns", true);
defaultPref("browser.aboutConfig.showWarning", false);
